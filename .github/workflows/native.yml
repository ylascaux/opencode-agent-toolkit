name: Native Runtime

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: extractions/setup-just@v3
      - name: Parse the daily command surface
        run: just --list
      - name: Install released OpenCode 2
        run: |
          npm install -g @opencode/cli@latest --no-audit --no-fund
          opencode --version
      - name: Native launch, configuration and project-context smoke
        run: python3 -B scripts/native-smoke
