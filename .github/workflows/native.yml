name: Native Runtime

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        major: ['1', '2']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: extractions/setup-just@v3
      - name: Parse the daily command surface
        run: just --list
      - name: Install upstream native CLI in the disposable runner
        env:
          MAJOR: ${{ matrix.major }}
        run: |
          if [ "$MAJOR" = 2 ]; then
            npm install -g @opencode/cli@0.0.0-beta-19507 --no-audit --no-fund
            opencode2 --version
          else
            npm install -g opencode-ai@latest --no-audit --no-fund
            opencode --version
          fi
      - name: Native launch, configuration and project-context smoke
        run: python3 -B scripts/native-smoke '${{ matrix.major }}'
