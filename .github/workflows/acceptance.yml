name: Runtime Acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: External-project acceptance
        run: python3 -B scripts/runtime-acceptance

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build current OpenCode 2 runtime image
        run: docker build -t opencode-agent-toolkit:acceptance -f runtime/Dockerfile .
      - name: Core acceptance against isolated project
        run: python3 -B scripts/runtime-acceptance
