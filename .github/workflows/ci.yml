name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - name: Install OpenCode V2 plugin SDK
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify OpenCode V2 plugin SDK resolution
        run: npm ls @opencode/plugin --depth=0
      - name: Python syntax
        run: python3 -m compileall -q scripts tests
      - name: Reliability, plan and sandbox core JavaScript syntax
        run: |
          node --check runtime/plugins/reliability-core.js
          node --check runtime/plugins/non-interactive-shell.js
          node --check runtime/plugins/plan-approval-core.js
          node --check runtime/plugins/sandbox-v1.js
      - name: V1 watchdog JavaScript syntax
        run: |
          node --check runtime/plugins/reliability-v1.js
          node --check runtime/plugins/reliability-v1-legacy.js
      - name: Native-loadable V2 TypeScript module execution
        run: |
          node runtime/plugins/reliability-v2.ts
          node runtime/plugins/reliability-v2-legacy.ts
          node runtime/plugins/plan-approval-v2.ts
          node plugins/reliability-approval/rpc.ts
          ln -s rpc.ts plugins/reliability-approval/rpc.js
          trap 'rm -f plugins/reliability-approval/rpc.js' EXIT
          node plugins/reliability-approval/index.ts
          node plugins/reliability-approval/tui.ts
      - name: Ensure runtime internals are not auto-discovered as V2 plugins
        run: test ! -d .opencode/plugins
      - name: Generate configs and run tests
        run: just check

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker runtime
        run: docker build -t opencode-agent-toolkit:ci -f runtime/Dockerfile .
      - name: Validate runtime tools and toolkit tests
        run: |
          docker run --rm --entrypoint bash opencode-agent-toolkit:ci -lc '
            set -euo pipefail
            cd /opt/oat
            cp .env.example .env
            set -a; source .env; set +a
            command -v opencode
            command -v opencode2
            command -v python3
            command -v node
            command -v nix
            command -v docker
            python3 ./scripts/generate-config >/dev/null
            python3 ./scripts/apply-reliability >/dev/null
            python3 -m json.tool opencode.jsonc >/dev/null
            python3 -m json.tool opencode.v2.jsonc >/dev/null
            python3 -m unittest discover -s tests -v
            node --test tests/*.test.mjs
          '
      - name: Validate Compose model
        env:
          OAT_RUNTIME_IMAGE: opencode-agent-toolkit:ci
          OAT_WORKSPACE_ROOT: ${{ github.workspace }}
          OAT_DOCKER_SOCKET: /var/run/docker.sock
          OAT_DATA_DIR: ${{ runner.temp }}/oat-data
        run: |
          mkdir -p "$OAT_DATA_DIR"
          cp .env.example .env
          docker compose -f compose.yaml config >/dev/null

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sandbox image
        run: docker build -t opencode-agent-toolkit-sandbox:ci -f sandbox/Dockerfile .
      - name: Sandbox security doctor
        env:
          OAT_SANDBOX_ENGINE: docker
          OAT_SANDBOX_IMAGE: opencode-agent-toolkit-sandbox:ci
        run: bash scripts/sandbox-doctor
