name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - name: Python syntax
        run: python3 -m compileall -q scripts tests
      - name: Shell syntax
        run: |
          for script in scripts/task-run scripts/task-dind scripts/workspace-broker scripts/docker-runtime scripts/opencode-agents scripts/bootstrap; do
            bash -n "$script"
          done
      - name: Generate stable config and run tests
        run: just check

  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker runtime
        run: docker build -t opencode-agent-toolkit:ci -f runtime/Dockerfile .
      - name: Validate stable runtime tools and tests
        run: |
          docker run --rm --entrypoint bash opencode-agent-toolkit:ci -lc '
            set -euo pipefail
            cd /opt/oat
            cp .env.example .env
            command -v opencode
            test "$(opencode --version | cut -d. -f1)" = "2"
            command -v python3
            command -v node
            python3 -B ./scripts/configure-local >/dev/null
            python3 -m json.tool opencode.jsonc >/dev/null
            test ! -e opencode.v2.jsonc
            python3 -m unittest discover -s tests -v
            node --test tests/*.test.mjs
          '
