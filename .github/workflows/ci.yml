name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax
        run: python3 -m compileall -q scripts tests
      - name: V1 watchdog JavaScript syntax
        run: node --check .opencode/plugins/reliability-v1.js
      - name: V2 watchdog TypeScript syntax
        run: node --experimental-strip-types --check .opencode/plugins/reliability-v2.ts
      - name: Generate configs and run tests
        run: just check
