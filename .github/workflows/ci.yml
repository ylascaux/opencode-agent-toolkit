name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      # Only contributor tests of retained historical plugins need this SDK.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python3 -m compileall -q scripts runtime tests
      - name: Native shell syntax
        run: |
          for script in scripts/bootstrap scripts/opencode-agents scripts/doctor; do
            bash -n "$script"
          done
      - run: just check
  native-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - run: npm install --global @opencode/cli@0.0.0-beta-19507
      - name: Real native V2 server without Docker or provider credentials
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          export XDG_DATA_HOME="$HOME/data" XDG_STATE_HOME="$HOME/state"
          export XDG_CONFIG_HOME="$HOME/config" XDG_CACHE_HOME="$HOME/cache"
          bash scripts/bootstrap
          toolkit="$PWD"
          project="$(mktemp -d)"
          cd "$project"
          OPENCODE_MAJOR=2 bash "$toolkit/scripts/opencode-agents" serve --hostname 127.0.0.1 --port 4096 > "$HOME/server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat "$HOME/server.log"' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4096/api/health; then ready=1; break; fi
            kill -0 "$pid"
            sleep 1
          done
          test "$ready" = 1
