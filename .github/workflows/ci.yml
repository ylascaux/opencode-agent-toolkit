name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Only contributor tests of retained historical plugins need this SDK.
      - run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - run: python3 -m compileall -q scripts runtime tests
      - name: Native shell syntax
        run: |
          for script in scripts/bootstrap scripts/opencode-agents scripts/doctor; do
            bash -n "$script"
          done
      - run: just check
  native-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global @opencode/cli@0.0.0-beta-19507
      - name: Real native V2 server and skill discovery without Docker
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          export XDG_DATA_HOME="$HOME/data" XDG_STATE_HOME="$HOME/state"
          export XDG_CONFIG_HOME="$HOME/config" XDG_CACHE_HOME="$HOME/cache"
          export OPENCODE_SERVER_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$OPENCODE_SERVER_PASSWORD"
          bash scripts/bootstrap
          toolkit="$PWD"
          project="$(mktemp -d)"
          mkdir -p "$project/.agents/skills/project-skill"
          printf '%s\n' '---' 'name: project-skill' 'description: Native runtime acceptance fixture' '---' 'Fixture skill.' > "$project/.agents/skills/project-skill/SKILL.md"
          cd "$project"
          git init -q
          OPENCODE_MAJOR=2 bash "$toolkit/scripts/opencode-agents" serve --hostname 127.0.0.1 --port 4096 > "$HOME/server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat "$HOME/server.log"' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS -u "opencode:$OPENCODE_SERVER_PASSWORD" http://127.0.0.1:4096/api/health; then ready=1; break; fi
            kill -0 "$pid"
            sleep 1
          done
          test "$ready" = 1
          # A healthy listener precedes PluginInternal.boot and its skill transforms.
          # Wait for the required catalog, not merely HTTP 200 or an empty data list.
          ready=0
          for _ in $(seq 1 30); do
            curl -fsS -u "opencode:$OPENCODE_SERVER_PASSWORD" -H "x-opencode-directory: $project" http://127.0.0.1:4096/api/skill > "$HOME/skills.json"
            if python3 -c 'import json,sys,pathlib; p=json.load(open(sys.argv[1])); assert isinstance(p.get("data"),list), p; assert pathlib.Path(p["location"]["directory"]).resolve()==pathlib.Path(sys.argv[2]).resolve(), p; names={s["name"] for s in p["data"]}; sys.exit(0 if {"project-skill","terraform-review","test-review"} <= names else 1)' "$HOME/skills.json" "$project"; then
              ready=1
              break
            fi
            kill -0 "$pid"
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then cat "$HOME/skills.json"; echo 'Required native skills were not discovered' >&2; exit 1; fi
          python3 -c 'import json,sys; print("PASS native skill discovery:", sorted(s["name"] for s in json.load(open(sys.argv[1]))["data"]))' "$HOME/skills.json"
