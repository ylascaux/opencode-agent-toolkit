name: opencode-agent-toolkit

x-runtime-common: &runtime-common
  image: ${OAT_RUNTIME_IMAGE:-opencode-agent-toolkit:local}
  build:
    context: .
    dockerfile: runtime/Dockerfile
    args:
      OPENCODE_V1_VERSION: ${OAT_OPENCODE_V1_VERSION:-latest}
      OPENCODE_V2_VERSION: ${OAT_OPENCODE_V2_VERSION:-beta}
  restart: unless-stopped
  env_file:
    - path: ./.env
      required: true
    - path: ./.env.local
      required: false
  environment:
    OAT_RUNTIME: container
    OAT_SANDBOX_HOST_SHELL: /bin/bash
    DOCKER_HOST: tcp://docker-agent:2375

services:
  # Normal interactive oc/oc2 usage keeps the host repository bind for editor
  # compatibility, but Docker commands target this isolated daemon rather than
  # the host Docker socket. The daemon is not published to the host.
  docker-agent:
    image: ${OAT_DIND_IMAGE:-docker:29-dind}
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - type: bind
        source: ${OAT_WORKSPACE_ROOT:?set OAT_WORKSPACE_ROOT through scripts/docker-runtime}
        target: ${OAT_WORKSPACE_ROOT:?set OAT_WORKSPACE_ROOT through scripts/docker-runtime}
      - dind-data:/var/lib/docker
    healthcheck:
      test: ["CMD-SHELL", "docker info >/dev/null 2>&1"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  oc-server:
    <<: *runtime-common
    depends_on:
      docker-agent:
        condition: service_healthy
    environment:
      OAT_RUNTIME: container
      OAT_SANDBOX_HOST_SHELL: /bin/bash
      DOCKER_HOST: tcp://docker-agent:2375
      OPENCODE_MAJOR: "1"
      OPENCODE_CONFIG: /opt/oat/opencode.jsonc
    volumes:
      - type: bind
        source: ${OAT_WORKSPACE_ROOT:?set OAT_WORKSPACE_ROOT through scripts/docker-runtime}
        target: ${OAT_WORKSPACE_ROOT:?set OAT_WORKSPACE_ROOT through scripts/docker-runtime}
      - oc-home:/root
      # Share only toolkit-owned persistent data/state across V1/V2. The rest
      # of the host home, including ~/.ssh, remains outside the runtime.
      - type: bind
        source: ${OAT_DATA_DIR:?set OAT_DATA_DIR through scripts/docker-runtime}
        target: /root/.local/share/opencode-agent-toolkit
      - type: bind
        source: ${OAT_STATE_DIR:?set OAT_STATE_DIR through scripts/docker-runtime}
        target: /root/.local/state/opencode-agent-toolkit
    ports:
      - "127.0.0.1:${OAT_OC_PORT:-4095}:4096"
    command: ["1"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/4096'"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s

  oc2-server:
    <<: *runtime-common
    depends_on:
      docker-agent:
        condition: service_healthy
    environment:
      OAT_RUNTIME: container
      OAT_SANDBOX_HOST_SHELL: /bin/bash
      DOCKER_HOST: tcp://docker-agent:2375
      OPENCODE_MAJOR: "2"
      OPENCODE_CONFIG: /opt/oat/opencode.v2.jsonc
    volumes:
      - type: bind
        source: ${OAT_WORKSPACE_ROOT:?set OAT_WORKSPACE_ROOT through scripts/docker-runtime}
        target: ${OAT_WORKSPACE_ROOT:?set OAT_WORKSPACE_ROOT through scripts/docker-runtime}
      - oc2-home:/root
      - type: bind
        source: ${OAT_DATA_DIR:?set OAT_DATA_DIR through scripts/docker-runtime}
        target: /root/.local/share/opencode-agent-toolkit
      - type: bind
        source: ${OAT_STATE_DIR:?set OAT_STATE_DIR through scripts/docker-runtime}
        target: /root/.local/state/opencode-agent-toolkit
    ports:
      - "127.0.0.1:${OAT_OC2_PORT:-4096}:4096"
      - "127.0.0.1:${OAT_OC2_OAUTH_PORT:-1455}:1455"
    command: ["2"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/4096'"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s

volumes:
  oc-home:
  oc2-home:
  dind-data:
