name: opencode-agent-toolkit

x-runtime-common: &runtime-common
  image: ${OAT_RUNTIME_IMAGE:-opencode-agent-toolkit:local}
  build:
    context: .
    dockerfile: runtime/Dockerfile
    args:
      OPENCODE_VERSION: ${OAT_OPENCODE_VERSION:-latest}
  restart: unless-stopped
  env_file:
    - path: ./.env
      required: true
    - path: ./.env.local
      required: false
  environment:
    OAT_RUNTIME: container
    OAT_SANDBOX_HOST_SHELL: /bin/bash
    DOCKER_HOST: tcp://docker-agent:2375

services:
  docker-agent:
    image: ${OAT_DIND_IMAGE:-docker:29-dind}
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - type: bind
        source: ${OAT_WORKSPACE_ROOT:?set OAT_WORKSPACE_ROOT through scripts/docker-runtime}
        target: ${OAT_WORKSPACE_ROOT:?set OAT_WORKSPACE_ROOT through scripts/docker-runtime}
      - dind-data:/var/lib/docker
    healthcheck:
      test: ["CMD-SHELL", "docker info >/dev/null 2>&1"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  oc-server:
    <<: *runtime-common
    depends_on:
      docker-agent:
        condition: service_healthy
    environment:
      OAT_RUNTIME: container
      OAT_SANDBOX_HOST_SHELL: /bin/bash
      DOCKER_HOST: tcp://docker-agent:2375
      OPENCODE_CONFIG: /opt/oat/opencode.jsonc
    volumes:
      - type: bind
        source: ${OAT_WORKSPACE_ROOT:?set OAT_WORKSPACE_ROOT through scripts/docker-runtime}
        target: ${OAT_WORKSPACE_ROOT:?set OAT_WORKSPACE_ROOT through scripts/docker-runtime}
      - oc-home:/root
    ports:
      - "127.0.0.1:${OAT_OC_PORT:-4096}:4096"
    command: ["serve"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/4096'"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s

volumes:
  oc-home:
  dind-data:
